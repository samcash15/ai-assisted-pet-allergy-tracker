<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f766e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Paw print (white) -->
  <!-- Outer left toe -->
  <ellipse cx="17" cy="30" rx="5" ry="6.5" fill="white" fill-opacity="0.93" transform="rotate(-22 17 30)"/>
  <!-- Inner left toe -->
  <ellipse cx="27" cy="23" rx="5" ry="6.5" fill="white" fill-opacity="0.93"/>
  <!-- Inner right toe -->
  <ellipse cx="37" cy="23" rx="5" ry="6.5" fill="white" fill-opacity="0.93"/>
  <!-- Outer right toe -->
  <ellipse cx="47" cy="30" rx="5" ry="6.5" fill="white" fill-opacity="0.93" transform="rotate(22 47 30)"/>
  <!-- Main central pad -->
  <ellipse cx="32" cy="44" rx="11.5" ry="9.5" fill="white" fill-opacity="0.93"/>
</svg>
